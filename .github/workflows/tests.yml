name: tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobbot
          POSTGRES_PASSWORD: jobbot123
          POSTGRES_DB: jobbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobbot"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jobbot:jobbot123@localhost:5432/jobbot_test
      JWT_SECRET_KEY: ci-secret-key-that-is-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install (pinned, every file hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Lock files match the .in files
        run: |
          pip install uv
          uv pip compile requirements.in --python-version 3.12 --python-platform linux --generate-hashes -q -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt) || { echo "requirements.txt is stale: recompile (command in requirements.in)"; exit 1; }
      - name: Lint and format (ruff; config in backend/pyproject.toml)
        run: ruff check . && ruff format --check .
      - name: Migrations build the schema the models describe
        env:
          DATABASE_URL: postgresql+asyncpg://jobbot:jobbot123@localhost:5432/jobbot_test
        run: alembic upgrade head && alembic check
      - run: pytest -q
      - name: Known vulnerabilities in pinned Python packages
        run: pip-audit -r requirements.txt --require-hashes --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - name: Known vulnerabilities in what ships to browsers (high and above)
        run: npm audit --omit=dev --audit-level=high
