# Hashed assets never change: cache forever. Everything else (index.html, API): re-check every time,
# so a deploy reaches users on their next navigation instead of their next hard reload.
map "$status:$uri" $cache_control {
    ~^200:/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;                      # unprivileged nginx: non-root, port > 1024
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 3m;          # resume uploads (API caps at 2 MB)

    # Browser-side security headers (QA S4). HSTS is set at the TLS edge (Cloudflare).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cache_control always;   # server level: a location add_header would drop the security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/;  # trailing slash strips /api
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;   # nginx adds these at the server level: send one copy
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location /assets/ {
        try_files $uri =404;          # a missing old bundle is a 404, not index.html served as JS
    }

    location / {
        try_files $uri /index.html;   # SPA: /matches, /preferences on refresh
    }
}
