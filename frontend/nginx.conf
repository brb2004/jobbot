server {
    listen 8080;                      # unprivileged nginx: non-root, port > 1024
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 3m;          # resume uploads (API caps at 2 MB)

    # Browser-side security headers (QA S4). HSTS goes on the TLS proxy (Caddy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/;  # trailing slash strips /api
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;   # SPA: /matches, /preferences on refresh
    }
}
