# Lint + format config only; the app isn't packaged.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]
ignore = [
    "B008",  # FastAPI's Depends(...) in argument defaults is the framework's own pattern
    "E501",  # the formatter keeps code within line-length; long strings and docstrings are allowed
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # settings come from the environment, so it's set before app/ is imported
