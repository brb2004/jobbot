host: jobmatch.bbenard.dev

image:
  api: jobbot-api
  web: jobbot-web
  tag: dev
  pullPolicy: IfNotPresent          # minikube: images loaded locally with `minikube image load`

existingSecret: jobbot-secrets      # created with kubectl, never stored in git

app:
  cookieSecure: "true"              # HTTPS at Cloudflare
  trustCfConnectingIp: "true"       # only reachable through the tunnel
  docsEnabled: "false"
  smtpHost: smtp.gmail.com          # provider's SMTP relay (STARTTLS); login + password live in the secret
  smtpPort: "587"

postgres:
  image: postgres:16
  storage: 2Gi

backups:
  storage: 2Gi
  keepDays: 3                       # copies on this machine (R2 holds the long history)
  offsite:
    enabled: true
    image: jobbot-backup:alpine3.20-1           # deploy/backup/Dockerfile (age + rclone)
    bucket: jobmatch-backup
    endpoint: https://ac44114a45c232f22f274ce7755fcfe8.r2.cloudflarestorage.com
    recipient: age1rpu6jwllxhr6na408cpwc7493atxlrltrr7ayqw5zyf2m2zhgp8qa4vyem   # public key: can lock, can't unlock
    secret: jobbot-backup-r2                    # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (made with kubectl, never in git)
    keepDays: 14

timeZone: America/Chicago
cronjobs:
  pipeline:
    schedule: "13 2 */2 * *"        # crawl + match every 2 days, 2:13am
    deadlineSeconds: 7200           # first big crawl took ~20 min; 2 h means something is stuck
    command: ["sh", "-c", "python -m app.ingest.run_ingest && python -m app.services.run_matching 20"]
  digest:
    schedule: "7 7 * * 1"           # Monday 7:07am email
    deadlineSeconds: 1800
    command: ["python", "-m", "app.services.run_digest"]
  feedback:
    schedule: "*/5 * * * *"         # send queued feedback acknowledgements (the request only queues)
    deadlineSeconds: 240
    command: ["python", "-m", "app.services.run_feedback"]
