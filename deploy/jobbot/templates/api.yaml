apiVersion: v1
kind: Service
metadata: {name: api}                         # nginx.conf proxies to http://api:8000
spec:
  selector: {app: api}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1                                 # rate limiter is in-memory: one replica until it moves to Redis
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, jobbot/db-client: "true", app.kubernetes.io/part-of: jobbot}}
    spec:
      initContainers:
        - name: migrate
          image: {{ include "jobbot.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "until alembic upgrade head; do echo 'waiting for db...'; sleep 3; done"]
          env: {{- include "jobbot.appEnv" . | nindent 12 }}
          securityContext: {{- include "jobbot.hardened" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: api
          image: {{ include "jobbot.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8000}]
          env: {{- include "jobbot.appEnv" . | nindent 12 }}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, periodSeconds: 5}      # can reach Postgres
          livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 15, failureThreshold: 4}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 1Gi}}   # + cached job index (~3 KB/job)
          securityContext: {{- include "jobbot.hardened" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
