apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: backups}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.backups.storage }}}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: backup}
spec:
  schedule: "37 3 * * *"                      # nightly 3:37am
  timeZone: {{ .Values.timeZone }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: {labels: {app: backup, jobbot/db-client: "true", app.kubernetes.io/part-of: jobbot}}
        spec:
          restartPolicy: Never
          securityContext: {fsGroup: 999}
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}}
              command:
                - sh
                - -c
                - >-
                  pg_dump -h db -U jobbot jobbot | gzip > /backups/jobbot-$(date +%F).sql.gz &&
                  find /backups -name '*.sql.gz' -mtime +{{ .Values.backups.keepDays }} -delete &&
                  ls -lh /backups
              volumeMounts: [{name: backups, mountPath: /backups}]
          volumes: [{name: backups, persistentVolumeClaim: {claimName: backups}}]
