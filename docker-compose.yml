services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobbot
      POSTGRES_PASSWORD: jobbot123
      POSTGRES_DB: jobbot
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: