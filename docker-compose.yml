services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobbot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm:
    restart: unless-stopped
    image: ollama/ollama:0.12.6
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama: